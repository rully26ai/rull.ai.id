name: Test SSH Connection to cPanel

on:
  workflow_dispatch:

jobs:
  test-ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=0
          for var in SSH_HOST SSH_USER SSH_PRIVATE_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::Secret $var belum diisi di GitHub Repository Secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Inspect cPanel domains and fetch rull.ai.id files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh /tmp/rull-site-files
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          SSH_OPTS="-i ~/.ssh/id_deploy -p $SSH_PORT -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"

          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE_EOF' > /tmp/remote_inspect.txt
          echo "=== UAPI DomainInfo domains_data ==="
          uapi DomainInfo domains_data 2>/dev/null || echo "uapi failed or unavailable"

          echo ""
          echo "=== USERDATA ==="
          grep -rnE '^(domain|documentroot):' ~/.cpanel/userdata/ 2>/dev/null || true

          echo ""
          echo "=== PUBLIC_HTML ==="
          ls -la ~/public_html 2>/dev/null || true

          DOCROOT=""
          if command -v uapi >/dev/null 2>&1 && command -v python3 >/dev/null 2>&1; then
            DOCROOT=$(uapi --output=json DomainInfo domains_data 2>/dev/null | python3 -c '
          import sys, json
          try:
            data = json.load(sys.stdin)
            res = data.get("result", {}).get("data", {})
            main = res.get("main_domain")
            if isinstance(main, dict) and main.get("domain") == "rull.ai.id":
              print(main.get("documentroot", ""))
              sys.exit(0)
            for k in ("addon_domains", "parked_domains", "sub_domains"):
              for d in res.get(k, []) or []:
                if isinstance(d, dict) and d.get("domain") == "rull.ai.id":
                  print(d.get("documentroot", ""))
                  sys.exit(0)
          except Exception:
            pass
          ' 2>/dev/null)
          fi

          if [ -z "$DOCROOT" ]; then
            UD_FILE=$(grep -rl "^domain: rull.ai.id$" ~/.cpanel/userdata/ 2>/dev/null | head -n 1)
            if [ -n "$UD_FILE" ]; then
              DOCROOT=$(grep -E '^documentroot:' "$UD_FILE" | head -n 1 | awk '{print $2}')
            fi
          fi

          if [ -z "$DOCROOT" ] && [ -d "$HOME/rull.ai.id" ]; then
            DOCROOT="$HOME/rull.ai.id"
          fi

          echo ""
          echo "=== RULL_AI_ID_DOCROOT ==="
          echo "$DOCROOT"

          if [ -n "$DOCROOT" ] && [ -d "$DOCROOT" ]; then
            echo ""
            echo "=== RULL_AI_ID_FILES ==="
            find "$DOCROOT" -maxdepth 4 -not -path '*/.*' -not -path '*/node_modules*' -not -path '*/vendor*' -ls 2>/dev/null
          else
            echo "DOCROOT not found or not a directory: $DOCROOT"
          fi
          REMOTE_EOF

          cat /tmp/remote_inspect.txt

          DOCROOT=$(awk '/^=== RULL_AI_ID_DOCROOT ===/{getline; print; exit}' /tmp/remote_inspect.txt)
          echo "Detected DOCROOT: $DOCROOT"

          if [ -n "$DOCROOT" ]; then
            ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "cd \"$DOCROOT\" && find . -maxdepth 4 -not -path '*/.*' -not -path './node_modules*' -not -path './vendor*' -type f -size -2M -print0 | tar --null -T - -czf -" | tar -xzf - -C /tmp/rull-site-files || true
            echo "=== COPIED FILES ==="
            find /tmp/rull-site-files -type f | sort
          fi

      - name: Upload rull-site-files artifact
        uses: actions/upload-artifact@v4
        with:
          name: rull-site-files
          path: /tmp/rull-site-files
          if-no-files-found: warn

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
